<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | escape }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 155 }}" />
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="icon" href="{{ '/assets/logo.jpg' | relative_url }}" type="image/jpeg">

  </head>
  <body>
    {% include header.html %}
    <main class="container" id="main">
      {% if page.url == '/about/' or page.url == '/contact/' %}
        <div class="article page-copy">
          <h1 class="headline">{{ page.title | escape }}</h1>
          <div class="content">{{ content }}</div>
        </div>
      {% else %}
        {{ content }}
      {% endif %}
    </main>
    {% include footer.html %}
    <script src="{{ "/assets/js/search.js" | relative_url }}" defer></script>
  </body>
</html>
