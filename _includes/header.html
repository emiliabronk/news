<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header container">
  <a class="masthead" href="{{ '/' | relative_url }}">
    <img class="logo" width="280" height="271" src="{{ '/assets/logo.png' | relative_url }}" alt="">
    <span class="masthead-title">{{ site.title | escape }}</span>
  </a>
  <nav class="nav" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Front page</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
  </nav>
</header>
